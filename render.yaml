services:
  - type: web
    name: resolvehub-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resolvehub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_AGENT_EMAIL
        sync: false
      - key: SEED_AGENT_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: 'true'
      - key: DEMO_AGENT_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: HOLIDAYS
        value: ''
databases:
  - name: resolvehub-db
    plan: free
    databaseName: resolvehub
    user: resolvehub
